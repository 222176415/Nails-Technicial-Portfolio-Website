name: Deploy Professional Nail Technician

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy: 
    # This is the operating system image the runner engine will execute on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the Repository source code
      - name: Check out the Repository
        uses: actions/checkout@v4

      # Step 2: Install and configure Node.js environment loop
      - name: Install Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 20

      # Step 3: Install clean clean dependencies
      - name: Install dependencies
      #Clean Install
        run: npm ci

      # Step 4: Build production asset layers
      - name: Build the project
        run: npm run build

      # Step 5: Deploy production bundle into your GitHub Pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
